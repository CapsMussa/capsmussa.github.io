<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фотографии ЧОУ ДПО "ГАРАНТ"</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Стиль миниатюр-шортков */
    #thumbs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 0;
    }
    .thumb {
      width: 60px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .thumb.border-primary {
      border-color: #0d6efd;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <!-- Переключатель автопроизведения -->
  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" id="autoplayToggle" checked>
    <label class="form-check-label" for="autoplayToggle">Автовоспроизведение</label>
  </div>

  <!-- Карусель Bootstrap 5 -->
  <div id="photoCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2500" data-bs-pause="hover">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="photo1.png" class="d-block h-100" alt="Фото 1">
      </div>
      <div class="carousel-item">
        <img src="photo2.png" class="d-block h-100" alt="Фото 2">
      </div>
      <div class="carousel-item">
        <img src="photo3.png" class="d-block h-100" alt="Фото 3">
      </div>
      <div class="carousel-item">
        <img src="photo4.png" class="d-block h-100" alt="Фото 4">
      </div> 
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#photoCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Предыдущее</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#photoCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Следующее</span>
    </button>
  </div>

  <!-- Миниатюры для переключения -->
  <div id="thumbs" class="mt-3">
    <img src="photo1.png" class="thumb border-primary" data-index="0" alt="Фото 1">
    <img src="photo2.png" class="thumb" data-index="1" alt="Фото 2">
    <img src="photo3.png" class="thumb" data-index="2" alt="Фото 3">
    <img src="photo4.png" class="thumb" data-index="2" alt="Фото 4">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const carouselEl = document.getElementById('photoCarousel');
  // Получаем или создаём экземпляр карусели
  const carousel = bootstrap.Carousel.getOrCreateInstance(carouselEl, {
    interval: 2500,
    wrap: true
  });

  // Управление автопроигрыванием через переключатель
  const autoplayToggle = document.getElementById('autoplayToggle');
  autoplayToggle.addEventListener('change', function() {
    if (this.checked) {
      carousel.cycle();
    } else {
      carousel.pause();
    }
  });

  // Переключение по миниатюрам
  const thumbs = document.querySelectorAll('#thumbs .thumb');
  thumbs.forEach(function(img) {
    img.addEventListener('click', function() {
      const idx = parseInt(this.dataset.index, 10);
      carousel.to(idx);
    });
  });

  // Подсветка активной миниатюры при смене слайда
  function updateActiveThumb(index) {
    thumbs.forEach((thumb, i) => {
      if (i === index) thumb.classList.add('border-primary');
      else thumb.classList.remove('border-primary');
    });
  }

  // Инициализация и обновление при каждом переключении
  document.getElementById('photoCarousel').addEventListener('slid.bs.carousel', function(e) {
    updateActiveThumb(e.to);
  });

  // Изначально выделим первый элемент
  updateActiveThumb(0);
});
</script>

</body>
</html>
