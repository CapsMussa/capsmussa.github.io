  <style>
    :root{
      --bg: #000;

    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }

    header { position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,.95); border-bottom: 1px solid var(--border); }
    .wrap { width: 92%; max-width: 1100px; margin: 0 auto; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; }

    .brand { color: var(--gold); font-weight: 800; letter-spacing: .5px; font-size: 18px; }

    /* Мобильное меню */
    #menu-toggle { display: none; }
    .hamburger { display: none; width: 40px; height: 28px; padding: 6px; cursor: pointer; justify-content: space-between; flex-direction: column; align-items: center; }
    .hamburger span { display: block; height: 3px; width: 100%; background: #fff; border-radius: 2px; }
    .nav { display: flex; gap: 12px; align-items: center; }

    @media (max-width: 900px){
      .hamburger { display: inline-flex; }
      .nav { display: none; flex-direction: column; position: absolute; top: 56px; left: 0; right: 0; padding: 8px 12px; background: rgba(0,0,0,.95); border-bottom: 1px solid var(--border); }
      #menu-toggle:checked ~ .nav { display: flex; }
    }

    /* Геро секция */
    .hero {
      padding: 60px 0 40px;
      text-align: center;
      background: linear-gradient(135deg, #000 0%, #111 60%, #1a0a0a 100%);
      position: relative;
      overflow: hidden;
    }
    .hero:before{
      content:"";
      position:absolute; right:-60px; top:-60px;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(213,170,70,.4), transparent 40%);
      filter: blur(0.5px);
    }
    .hero h1 { font-size: clamp(28px, 4vw + 12px, 48px); margin: 0 0 8px; font-weight: 900; color:#fff; }
    .hero p { margin: 0; color: #e9e9e9; }
    .hero .cta { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; border: none;
                 background: var(--brand-grad); color: #000; font-weight: 800; cursor: pointer; }
    .badge { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:#1a1a1a; color:#fff; border:1px solid var(--border); font-weight:600; }

    main { padding: 28px 0 60px; }

    section { padding: 40px 0; }
    h2 { font-size: 28px; margin: 0 0 8px; color: #fff; }
    .lead { color: var(--muted); margin-bottom: 12px; }

    /* Карточки услуг с SVG-иконками */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card { display:flex; gap:12px; align-items: center;
            background: #141414; border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow: var(--shadow); }
    .card-visual { width: 64px; height: 64px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:#0a0a0a; border:1px solid #2a2a2a; }
    .card h3 { margin:0 0 6px; font-size:16px; }
    .price { font-weight:800; color: var(--gold); font-size:18px; }
    .card-desc { color:#cbd5e1; font-size:13px; }

    /* Контакты и форма */
    .contact { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
    .box { padding:14px; background:#0f0f0f; border-radius:10px; border:1px solid var(--border); }
    .socials { display:flex; gap:12px; flex-wrap:wrap; }

    form { display: grid; gap:8px; }
    input, textarea, select { width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); background:#0a0a0a; color:#fff; }
    label { font-size: 12px; color: #ddd; }
    button { padding:12px 14px; border-radius:6px; border:none; background: var(--gold); color:#000; font-weight:700; cursor:pointer; }
    button:hover { filter: brightness(1.05); }

    @media (max-width: 900px){
      .contact { grid-template-columns:1fr; }

    .fade { opacity: 0; transform: translateY(12px); transition: all .6s ease; }
    .fade.in { opacity: 1; transform: translateY(0); }

    pre.sla-text { white-space: pre-wrap; background:#0b0b0b; padding:12px; border-radius:8px; border:1px solid var(--border); color:#e6e6e6; }
